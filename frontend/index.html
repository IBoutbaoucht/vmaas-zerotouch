<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMaaS · Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold tracking-tight">VMaaS Console</h1>
        <p class="text-xs text-slate-400">Provision Ubuntu VMs on ESXi via cloud-init guestinfo.</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="health-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-600" title="ESXi reachability"></span>
        <span id="health-label" class="text-xs text-slate-400">checking…</span>
        <button id="token-btn" class="text-xs px-2 py-1 rounded border border-slate-700 hover:bg-slate-800">API token</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">

    <!-- Pool meter -->
    <section class="bg-slate-900 rounded-lg p-5 border border-slate-800">
      <div class="flex items-baseline justify-between">
        <h2 class="text-sm uppercase tracking-wider text-slate-400">IP pool</h2>
        <div id="pool-summary" class="text-sm text-slate-300">— / —</div>
      </div>
      <div id="pool-grid" class="mt-3 grid grid-cols-8 gap-1.5"></div>
    </section>

    <!-- New VM form -->
    <section class="bg-slate-900 rounded-lg p-5 border border-slate-800">
      <h2 class="text-sm uppercase tracking-wider text-slate-400 mb-3">New VM</h2>
      <form id="new-form" class="flex flex-wrap items-center gap-3">
        <input id="new-name" type="text" placeholder="Optional name (auto if blank)"
               class="flex-1 min-w-[200px] bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
        <button type="submit"
                class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-medium">
          Provision
        </button>
        <span id="new-result" class="text-xs text-slate-400"></span>
      </form>
    </section>

    <!-- VM list -->
    <section class="bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
        <h2 class="text-sm uppercase tracking-wider text-slate-400">VMs</h2>
        <span id="list-meta" class="text-xs text-slate-500">—</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-500 text-xs uppercase tracking-wider">
            <tr>
              <th class="px-5 py-2 text-left">Name</th>
              <th class="px-5 py-2 text-left">Status</th>
              <th class="px-5 py-2 text-left">IP</th>
              <th class="px-5 py-2 text-left">Age</th>
              <th class="px-5 py-2 text-left">Error</th>
              <th class="px-5 py-2 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="vm-tbody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Modal: VM detail -->
  <div id="modal-bg" class="hidden fixed inset-0 bg-black/70 z-40 items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-lg w-full max-w-xl p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="modal-title" class="text-lg font-semibold"></h3>
        <button id="modal-close" class="text-slate-400 hover:text-slate-100">×</button>
      </div>
      <pre id="modal-body" class="text-xs bg-slate-950 border border-slate-800 rounded p-3 overflow-x-auto"></pre>
      <div id="modal-actions" class="flex justify-end gap-2"></div>
    </div>
  </div>

  <!-- Modal: token -->
  <div id="token-bg" class="hidden fixed inset-0 bg-black/70 z-40 items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-lg w-full max-w-md p-6 space-y-3">
      <h3 class="text-lg font-semibold">API token</h3>
      <p class="text-xs text-slate-400">
        Stored in <code>localStorage</code>. Sent as
        <code>Authorization: Bearer …</code> on every request.
      </p>
      <input id="token-input" type="password" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm" />
      <div class="flex justify-end gap-2">
        <button id="token-cancel" class="px-3 py-1.5 text-sm rounded border border-slate-700">Cancel</button>
        <button id="token-save" class="px-3 py-1.5 text-sm rounded bg-emerald-600 hover:bg-emerald-500">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
