# nginx config for the VMaaS frontend.
#
# Three responsibilities:
#   1. Serve the static UI from /usr/share/nginx/html.
#   2. Reverse-proxy /api/* to the backend. The backend speaks /v1/* — we
#      strip /api in the location block so the URLs stay tidy from the JS.
#   3. Pass /healthz straight through so the health badge can hit it without
#      CORS games.
#
# The backend runs with `network_mode: host` (so its routing matches the
# host's), so from this container's perspective the backend is reachable
# at host.docker.internal:8080 on Docker Desktop, or at the docker0
# gateway IP on Linux. We use the env var BACKEND_HOST to keep that
# decision out of the image.

server {
  listen 80;
  server_name _;

  # Allow uploads of any reasonable JSON payload.
  client_max_body_size 1m;

  root /usr/share/nginx/html;
  index index.html;

  # API: strip the /api prefix and forward to the backend's /v1.
  location /api/ {
    proxy_pass http://host.docker.internal:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Health endpoint — same backend, no prefix rewrite needed.
  location = /healthz {
    proxy_pass http://host.docker.internal:8080/healthz;
    proxy_http_version 1.1;
  }

  # Everything else is a static file from the UI.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
